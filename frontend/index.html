<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6ea879" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SALT Ping Pong League 2026</title>
  </head>

  <body class="app-loading">
    <div id="app">
      <!-- Header -->
      <header>
        <img class="logo" src="./assets/logo.png" alt="SALT Ping-Pong League" />
      </header>

      <!-- Main content -->
      <main>
        <!-- ARCADE MODE VIEW -->
        <section id="arcade-view" class="view">
          <h2>Arcade Mode</h2>

          <div class="arcade-toggle-row">
            <span class="arcade-toggle-label">Arcade Mode</span>
            <label class="toggle-switch">
              <input type="checkbox" id="arcade-mode-toggle" />
              <span class="toggle-switch-track"></span>
            </label>
          </div>

          <div id="arcade-sub-toggles" class="arcade-sub-toggles hidden">
            <div class="arcade-toggle-row">
              <span class="arcade-toggle-label">Music</span>
              <label class="toggle-switch">
                <input type="checkbox" id="arcade-music-toggle" />
                <span class="toggle-switch-track"></span>
              </label>
            </div>
            <div class="arcade-toggle-row">
              <span class="arcade-toggle-label">SFX</span>
              <label class="toggle-switch">
                <input type="checkbox" id="arcade-sfx-toggle" />
                <span class="toggle-switch-track"></span>
              </label>
            </div>
          </div>

          <form id="add-player-form" class="add-player-form">
            <h3 class="add-player-heading">Add a player</h3>
            <input
              type="text"
              id="add-player-name"
              class="add-player-input"
              placeholder="Player name"
              maxlength="40"
              required
            />
            <button type="submit" id="add-player-submit">ADD PLAYER</button>
          </form>
        </section>

        <!-- REPORT VIEW -->
        <section id="report-view" class="view">
          <div class="players-row">
            <!-- Player 1 -->
            <div class="player player-top">
              <div id="player-card-top" class="player-card">
                <img
                  id="player-avatar-top"
                  class="player-avatar"
                  src="/assets/unknown-player-avatar.png"
                  alt="Generic avatar"
                />
                <span id="player-name-top" class="player-name">PLAYER 1</span>
              </div>

              <div class="score-controls">
                <button id="p1-plus" class="btn-plus">+</button>
                <span class="score" id="score-p1">0</span>
                <button id="p1-minus" class="btn-minus">-</button>
              </div>
            </div>

            <!-- Player 2 -->
            <div class="player player-bottom">
              <div id="player-card-bottom" class="player-card">
                <img
                  id="player-avatar-bottom"
                  class="player-avatar"
                  src="/assets/unknown-player-avatar.png"
                  alt="Generic avatar"
                />
                <span id="player-name-bottom" class="player-name">PLAYER 2</span>
              </div>

              <div class="score-controls">
                <button id="p2-plus" class="btn-plus">+</button>
                <span class="score" id="score-p2">0</span>
                <button id="p2-minus" class="btn-minus">-</button>
              </div>
            </div>
          </div>

          <!-- Submit -->
          <div class="submit-container">
            <button id="submit-btn">SUBMIT SCORE</button>
          </div>
        </section>

        <!-- RESULTS VIEW (placeholder) -->
        <section id="results-view" class="view">
          <h2>Results</h2>
          <div id="results-list">
            <!-- fylls via TS -->
          </div>
        </section>

        <!-- TEAM STANDINGS VIEW (placeholder) -->
        <section id="team-standings-view" class="view">
          <h2>Team Standings</h2>
          <div id="team-standings-list">
            <!-- fylls via TS -->
          </div>
        </section>

        <!-- PLAYER STANDINGS VIEW (placeholder) -->
        <section id="player-standings-view" class="view">
          <h2>Player Standings</h2>
          <div id="player-standings-list">
            <!-- fylls via TS -->
          </div>
        </section>
      </main>

      <!-- Navigation (vänster/höger) -->
      <nav class="nav-buttons">
        <button id="prev-view">❮</button>
        <button id="next-view">❯</button>
      </nav>

      <div id="player-picker" class="player-picker hidden">
        <div class="player-picker-content">
          <h2 id="player-picker-title">Choose player</h2>

          <div class="player-picker-tabs">
            <button
              type="button"
              class="player-picker-tab team-java"
              data-team="java"
            >
              <img src="/assets/team-java.png" alt="" />
              <span>Java</span>
            </button>
            <button
              type="button"
              class="player-picker-tab team-core"
              data-team="core"
            >
              <img src="/assets/team-salt-core.png" alt="" />
              <span>Core &amp; Alumni</span>
            </button>
            <button
              type="button"
              class="player-picker-tab team-data-ai"
              data-team="data-ai"
            >
              <img src="/assets/team-data-ai.png" alt="" />
              <span>Data &amp; AI</span>
            </button>
          </div>

          <div id="player-picker-list-wrap" class="player-picker-list-wrap">
            <div id="player-picker-list-scroll" class="player-picker-list-scroll">
              <div id="player-picker-list"></div>
            </div>
            <div id="player-picker-fade" class="player-picker-fade"></div>
          </div>
        </div>
      </div>

      <div id="match-details-modal" class="match-details-modal hidden">
        <div class="match-details-content">
          <button
            id="match-details-close"
            class="match-details-close"
            aria-label="Close"
          >
            &times;
          </button>

          <div id="match-details-body"></div>

          <button id="match-details-delete" class="match-details-delete hidden">
            Delete match
          </button>
        </div>
      </div>

      <div id="player-details-modal" class="player-details-modal hidden">
        <div class="player-details-content">
          <button
            id="player-details-close"
            class="player-details-close"
            aria-label="Close"
          >
            &times;
          </button>

          <div id="player-details-body"></div>
        </div>
      </div>

      <div id="team-details-modal" class="team-details-modal hidden">
        <div class="team-details-content">
          <button
            id="team-details-close"
            class="team-details-close"
            aria-label="Close"
          >
            &times;
          </button>

          <div id="team-details-body"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
