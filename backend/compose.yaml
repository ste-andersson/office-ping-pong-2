services:
  postgres:
    image: postgres:16
    container_name: office-ping-pong-postgres
    environment:
      POSTGRES_DB: office_ping_pong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: